[package]
name = "quickdpi"
version = "0.1.0"
edition = "2024"
description = "Tepside çalışan, tam otomatik ağ güvenliği aracı (Linux + Windows)"
authors = ["EarthQuick"]
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
nfq = "0.2.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_IO", "Win32_Globalization"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[package.metadata.deb]
maintainer = "EarthQuick"
section = "net"
depends = "$auto, nftables, pkexec | policykit-1"
extended-description = "QuickDPI tepside çalışır; bağlantıları paket bölme ve güvenli DNS ile korur. Ayarı kendisi bulur."
assets = [
    ["target/release/quickdpi", "usr/bin/", "755"],
    ["assets/quickdpi.desktop", "usr/share/applications/", "644"],
    ["assets/quickdpi.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/dev.earthquick.quickdpi.policy", "usr/share/polkit-1/actions/", "644"],
    ["vendor/windivert/LICENSE", "usr/share/doc/quickdpi/WinDivert-LICENSE", "644"],
]
